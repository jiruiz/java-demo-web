<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista mediante API</title>
</head>

<body>

    <h1>Lista de alumnos usando JavaScript</h1>

    <button onclick="listarAlumnosApi()">
        Actualizar
    </button>

    <p id="mensaje"></p>

    <table border="1">
        <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Promedio</th>
            </tr>
        </thead>

        <tbody id="tablaAlumnos"></tbody>
    </table>

    <br>

    <a href="/lista">
        Ver versión Thymeleaf
    </a>

    <script src="/js/lista-api.js"></script>

</body>

</html>
