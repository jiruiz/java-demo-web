<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar alumno</title>
</head>

<body>

    <h1>Editar alumno</h1>

    <form action="/alumnos/editar" method="post">

        <div>
            <label for="dni">DNI:</label>

            <input
                type="number"
                id="dni"
                name="dni"
                th:value="${alumno.dni}"
                readonly>
        </div>

        <br>

        <div>
            <label for="nombre">Nombre:</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                th:value="${alumno.nombre}"
                required>
        </div>

        <br>

        <div>
            <label for="apellido">Apellido:</label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                data-th-value="${alumno.apellido}"
                required>
        </div>

        <br>

        <div>
            <label for="fechaNacimiento">
                Fecha de nacimiento:
            </label>

            <input
                type="date"
                id="fechaNacimiento"
                name="fechaNacimiento"
                data-th-value="${alumno.fechaNacimiento}"
                required>
        </div>

        <br>

        <div>
            <label for="estado">Estado:</label>

            <input
                type="text"
                id="estado"
                name="estado"
                data-th-value="${alumno.estado}"
                required>
        </div>

        <br>

        <div>
            <label for="promedio">Promedio:</label>

            <input
                type="number"
                id="promedio"
                name="promedio"
                step="0.01"
                data-th-value="${alumno.promedio}"
                required>
        </div>

        <br>

        <div>
            <label for="cantidadMateriasAprobadas">
                Materias aprobadas:
            </label>

            <input
                type="number"
                id="cantidadMateriasAprobadas"
                name="cantidadMateriasAprobadas"
                data-th-value="${alumno.cantidadMateriasAprobadas}"
                required>
        </div>

        <br>

        <div>
            <label for="fechaIngreso">
                Fecha de ingreso:
            </label>

            <input
                type="date"
                id="fechaIngreso"
                name="fechaIngreso"
                data-th-value="${alumno.fechaIngreso}"
                required>
        </div>

        <br>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="/lista">Cancelar</a>

</body>

</html>
